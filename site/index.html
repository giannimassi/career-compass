// --- State ---
let CURRENT_LANG = "en";
let PROMPT_TEXT = null;

// --- Prompt loading (for manual copy fallback) ---
async function loadPrompt() {
  if (PROMPT_TEXT) return PROMPT_TEXT;
  try {
    const r = await fetch('./prompt.md');
    if (!r.ok) throw new Error('local fetch failed');
    PROMPT_TEXT = await r.text();
  } catch (e) {
    try {
      const r2 = await fetch('https://raw.githubusercontent.com/giannimassi/career-compass/main/prompt.md');
      PROMPT_TEXT = await r2.text();
    } catch (e2) {
      PROMPT_TEXT = null;
    }
  }
  return PROMPT_TEXT;
}

// --- Render ---
function render(lang) {
  const t = STRINGS[lang] || STRINGS.en;
  CURRENT_LANG = lang;

  document.documentElement.lang = lang;
  document.body.dir = t.dir;

  document.getElementById("tagline").textContent = t.tagline;
  document.getElementById("howto-heading").textContent = t.howto;
  document.getElementById("llm-hint").textContent = t.llmHint;
  document.getElementById("or-label").textContent = t.or;
  document.getElementById("copy-btn").textContent = t.copyBtn;
  document.getElementById("copy-hint").textContent = t.copyHint;
  document.getElementById("who-heading").textContent = t.who;
  document.getElementById("who-body").textContent = t.whoBody;
  document.getElementById("what-heading").textContent = t.what;
  document.getElementById("what-body").textContent = t.whatBody;
  document.getElementById("privacy-note").textContent = t.privacy;
  document.getElementById("tips-heading").textContent = t.tips;
  document.getElementById("more-heading").textContent = t.more;
  document.getElementById("footer-text").textContent = t.footer;

  // Steps
  const ol = document.getElementById("howto-steps");
  ol.innerHTML = "";
  t.steps.forEach(s => {
    const li = document.createElement("li");
    li.textContent = s;
    ol.appendChild(li);
  });

  // LLM buttons — each copies the prompt and opens the chat
  const grid = document.getElementById("llm-grid");
  grid.innerHTML = "";
  LLMS.forEach(l => {
    const a = document.createElement("a");
    a.className = "llm-btn";
    a.href = l.href;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = l.name;
    a.addEventListener("click", () => {
      if (PROMPT_TEXT) {
        navigator.clipboard.writeText(PROMPT_TEXT).catch(() => {});
      } else {
        // Not loaded yet — kick off load and copy when ready
        loadPrompt().then(text => {
          if (text) navigator.clipboard.writeText(text).catch(() => {});
        });
      }
      showCopied(l.name);
    });
    grid.appendChild(a);
  });

  // Tips
  const tipsUl = document.getElementById("tips-list");
  tipsUl.innerHTML = "";
  t.tipsList.forEach(s => {
    const li = document.createElement("li");
    li.textContent = s;
    tipsUl.appendChild(li);
  });

  // Links
  const moreUl = document.getElementById("more-links");
  moreUl.innerHTML = "";
  t.links.forEach(link => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = link.href;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = link.label;
    li.appendChild(a);
    moreUl.appendChild(li);
  });
}

// --- Toast after LLM button click ---
let TOAST_TIMEOUT = null;
function showCopied(providerName) {
  const t = STRINGS[CURRENT_LANG] || STRINGS.en;
  const toast = document.getElementById("toast");
  toast.textContent = t.llmCopied.replace("{provider}", providerName);
  toast.classList.add("show");
  if (TOAST_TIMEOUT) clearTimeout(TOAST_TIMEOUT);
  TOAST_TIMEOUT = setTimeout(() => toast.classList.remove("show"), 5000);
}

// --- Copy full prompt ---
async function copyPrompt() {
  const t = STRINGS[CURRENT_LANG] || STRINGS.en;
  const btn = document.getElementById("copy-btn");
  const text = await loadPrompt();
  if (!text) {
    btn.textContent = t.copyFailed;
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = t.copied;
    btn.classList.add("ok");
    setTimeout(() => {
      btn.textContent = t.copyBtn;
      btn.classList.remove("ok");
    }, 3500);
  } catch (e) {
    btn.textContent = t.copyPressToCopy;
  }
}

// --- Language selection ---
function detectInitialLang() {
  const params = new URLSearchParams(location.search);
  const qp = params.get("lang");
  if (qp && STRINGS[qp]) return qp;
  try {
    const saved = localStorage.getItem("cc-lang");
    if (saved && STRINGS[saved]) return saved;
  } catch (e) {}
  const nav = (navigator.language || "").toLowerCase();
  const base = nav.split("-")[0];
  if (STRINGS[base]) return base;
  return "en";
}

function populateSelector() {
  const sel = document.getElementById("lang-select");
  Object.entries(STRINGS).forEach(([code, t]) => {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = t.lang;
    sel.appendChild(opt);
  });
  sel.value = CURRENT_LANG;
  sel.addEventListener("change", (e) => {
    const lang = e.target.value;
    try { localStorage.setItem("cc-lang", lang); } catch (err) {}
    render(lang);
  });
}

// --- Init ---
(function init() {
  CURRENT_LANG = detectInitialLang();
  render(CURRENT_LANG);
  populateSelector();
  loadPrompt(); // warm cache for copy-prompt button
})();
